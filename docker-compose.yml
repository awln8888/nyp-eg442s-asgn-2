services:
  web:
    build: web
    ports:
      - "8000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/myapp_db
      - DATA_GOV_SG_API_KEY=${DATA_GOV_SG_API_KEY}
    volumes:
      - ./web:/web
    depends_on:
      - db
    networks:
      - my_custom_network
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_custom_network
networks:
  my_custom_network:
    driver: bridge
volumes:
  postgres_data:
